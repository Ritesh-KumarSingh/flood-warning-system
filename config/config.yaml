# API Configuration
weather_api:
  base_url: "https://api.openweathermap.org/data/2.5"
  api_key: "YOUR_API_KEY_HERE"  # Get free key from openweathermap.org

# Model Configuration
model:
  type: "RandomForestClassifier"
  n_estimators: 100
  random_state: 42
  test_size: 0.2

# Risk Thresholds (0-1 probability scale)
risk_levels:
  safe: 0.3
  warning: 0.6
  high_risk: 0.8
  critical: 1.0

# Alert Messages
alerts:
  safe: "No flood risk detected. Weather conditions are normal."
  warning: "Moderate flood risk. Monitor weather updates and prepare emergency kit."
  high_risk: "High flood risk expected. Prepare to evacuate if advised."
  critical: "CRITICAL: Immediate flood danger! Evacuate to higher ground NOW!"

# Data paths
paths:
  raw_data: "data/raw/flood_data.csv"
  processed_data: "data/processed/clean_data.csv"
  model_save: "data/models/flood_model.pkl"
