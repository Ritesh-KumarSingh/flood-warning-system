# Render.com Build Configuration
# This file tells Render how to build and start your application

# Build command (run once during deployment)
build:
  - pip install -r requirements.txt

# Start command for API backend
web:
  - uvicorn src.backend.main:app --host 0.0.0.0 --port $PORT

# Start command for Streamlit dashboard (alternative)
# streamlit:
#   - streamlit run src/frontend/user_flow_app.py --server.port $PORT --server.address 0.0.0.0

# Environment variables needed:
# - OPENWEATHER_API_KEY (optional, for live weather)
# - TWILIO_* (optional, for SMS alerts)